# 复制本文件为 benchmark.ini 后使用。
# benchmark.ini 已被 .gitignore 忽略，可以填写本地密钥；不要把真实密钥提交到 GitHub。

[run]
# 可选：aliyun（阿里云）或 vol（字节）。
product = aliyun

# 需要测试的启动规模，逗号分隔；只测部分档位时直接删除其他数字。
rates = 1,10,50,100,200
duration_seconds = 60
storages = none
max_workers = 1000
output = results

# true：每个TPS档位的第1个沙箱不参与mean，但仍参与min/max/P50/P90/P95/P99。
exclude_first_from_mean = true

[product.aliyun]
name = 阿里云
# 两种方式任选一种：直接填写 api_key，或者留空并通过 api_key_env 指定环境变量。
api_key =
api_key_env = E2B_API_KEY
api_url = https://api.cn-beijing.e2b.fc.aliyuncs.com
domain = cn-beijing.e2b.fc.aliyuncs.com
template = code-interpreter-v1
sandbox_timeout = 300

# 无挂载测试不需要填写下面这些字段。
vpc_config_json =
oss_config_json =
role_arn =
file_metadata_key =
file_config_json =
extra_metadata_json =

[product.vol]
name = 字节
# 截图中的旧Key已经暴露，请撤销后在本地填写新Key。
api_key =
api_key_env = VOL_E2B_API_KEY
api_url = https://api.vefaas-e2b.sandbox-cn-beijing.volcapig.com
domain = vefaas-e2b.sandbox-cn-beijing.volcapig.com
template = zhbatkbe
sandbox_timeout = 300

# 无挂载测试不需要填写下面这些字段。
vpc_config_json =
oss_config_json =
role_arn =
file_metadata_key =
file_config_json =
extra_metadata_json =
